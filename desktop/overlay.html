<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>EXP Tracker</title>
<style>
  /* the website's overlay (src/ui/styles.css .ov), as a window of its own */
  :root{--tx:#eeecf8;--mut:#9c97b9;--acc:#8b7bff;--warm:#ffb257;--exp:#a6e05a;--ok:#5ccf86;--bad:#ff6b78;--panel2:#221f3c;--line:#2f2b50}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#13112a;overflow:hidden;user-select:none}
  body{font:12px/1.4 system-ui,Segoe UI,sans-serif;color:var(--tx)}
  .ov{height:100vh;display:flex;flex-direction:column;gap:8px;padding:8px 10px 10px;background:linear-gradient(#1d1a38,#13112a);font-variant-numeric:tabular-nums;border:1px solid var(--line)}
  .ov-head{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.6px;-webkit-app-region:drag;cursor:move}
  .ov-head b{color:var(--acc)}
  .ov-time{color:var(--mut);letter-spacing:0}
  .sp{flex:1}
  .ov-name{font-weight:700;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
  button{-webkit-app-region:no-drag;background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:99px;padding:1px 7px;font:inherit;font-size:10px;line-height:16px;cursor:pointer}
  button:hover:not(:disabled){border-color:var(--acc)}button:disabled{opacity:.4;cursor:default}
  .upd{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
  .upd[hidden],.updating[hidden]{display:none}
  .notice{position:fixed;left:10px;right:10px;bottom:8px;padding:5px 8px;border-radius:8px;background:#2a1f12;border:1px solid rgba(255,178,87,.4);color:var(--warm);font-size:11px}
  .notice[hidden]{display:none}
  .updating{color:var(--warm);font-size:10px;letter-spacing:0;white-space:nowrap}
  .x{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;padding:0}
  .x:hover{border-color:var(--bad);color:var(--bad)}
  .pp.wide{width:auto;gap:4px;padding:0 9px;font-size:10.5px;font-weight:700}
  .pp.go{background:var(--acc);border-color:var(--acc);color:#fff}
  .pp{display:inline-flex;align-items:center;justify-content:center;width:26px;height:20px;padding:0}
  .ov-dot{width:7px;height:7px;border-radius:99px;background:var(--mut)}
  .ov-dot.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}.ov-dot.paused{background:var(--warm)}
  .ov-bar{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
  .ov-lv{display:flex;align-items:baseline;gap:2px;padding:1px 7px;border-radius:7px;background:var(--acc);color:#fff;font-size:10px;font-weight:800;white-space:nowrap}
  .ov-lv b{font-size:15px}
  .ov-exp{position:relative;flex:1;height:20px;border-radius:6px;background:#0d0c1d;border:1px solid var(--line);overflow:hidden}
  .ov-exp div{position:absolute;inset:0 auto 0 0;background:linear-gradient(#c3f07c,var(--exp))}
  .ov-exp span{position:relative;display:block;text-align:center;font-size:11px;line-height:18px;font-weight:700;text-shadow:0 1px 2px #000}
  .ov-exp i{color:#ffd76b;font-style:italic}
  .ov-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:6px 8px}
  .ov-stats div{display:flex;flex-direction:column;min-width:0}
  .ov-stats span{color:var(--mut);font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
  .ov-stats b{font-size:15px;white-space:nowrap}
  .pos{color:var(--exp)}.neg{color:var(--bad)}
  .wait{display:none;flex:1;flex-direction:column;justify-content:center;gap:6px;color:var(--mut);font-size:11px}
  .wait button{align-self:flex-start;font-size:11px;padding:2px 10px}
  .waiting .wait{display:flex}.waiting .live{display:none}
</style>
</head>
<body>
<div class="ov waiting" id="ov">
  <div class="ov-head">
    <span class="ov-dot" id="dot"></span><b>EXP TRACKER</b><span class="ov-time" id="time"></span>
    <span class="sp"></span><span class="ov-name" id="name"></span>
    <button id="pp" class="pp"></button>
    <button id="stop" class="pp" title="End the session (saved to History)" disabled><svg viewBox="0 0 10 10" width="10" height="10"><rect x="1.8" y="1.8" width="6.4" height="6.4" rx="1" fill="currentColor"/></svg></button>
    <span id="updating" class="updating" hidden></span>
    <button id="upd" class="upd" hidden>Update</button>
    <button id="more" title="Menu">⋯</button>
    <button id="close" class="x" title="Close the overlay"><svg viewBox="0 0 10 10" width="9" height="9"><path d="M2 2 8 8M8 2 2 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  </div>
  <div class="wait">
    <span>Press <b>▶ Start tracking</b> to share the MapleStory window through Windows (this app tracks it) or through your browser (the website).</span>
  </div>
  <div class="ov-bar live">
    <span class="ov-lv">LV.<b id="lv">?</b></span>
    <div class="ov-exp"><div id="fill" style="width:0"></div><span><i>EXP</i> <span id="exp" style="display:inline">—</span></span></div>
  </div>
  <div class="ov-stats live" id="stats"></div>
  <div class="notice" id="notice" hidden></div>
</div>
<script>
  const $ = id => document.getElementById(id);
  const text = (el, v) => { el.textContent = v ?? ''; };
  $('more').onclick = () => window.overlay.menu();
  $('close').onclick = () => window.overlay.close();
  $('upd').onclick = () => window.overlay.installUpdate();
  let noticeT = 0;
  window.overlay.onNotice(text => { const n = $('notice'); n.textContent = text; n.hidden = false; clearTimeout(noticeT); noticeT = setTimeout(() => { n.hidden = true; }, 7000); });
  window.overlay.onUpdating(v => { $('updating').hidden = !v; $('updating').textContent = v ? 'Updating to ' + v + '…' : ''; });
  window.overlay.onUpdate(v => { $('upd').hidden = false; $('upd').title = 'Version ' + v + ' is ready: click to restart into it (it also installs when you quit)'; });
  // one button, play or pause by state; the same two icons as the website's overlay
  const ICON = {
    pause: '<svg viewBox="0 0 10 10" width="10" height="10"><rect x="1.8" y="1.2" width="2.3" height="7.6" rx=".5" fill="currentColor"/><rect x="5.9" y="1.2" width="2.3" height="7.6" rx=".5" fill="currentColor"/></svg>',
    play: '<svg viewBox="0 0 10 10" width="10" height="10"><path d="M2.4 1.4 8.6 5 2.4 8.6Z" fill="currentColor" stroke="currentColor" stroke-width=".8" stroke-linejoin="round"/></svg>',
  };
  // the main button, by state: Start tracking (share the game) → Start session → ⏸ → ▶ (resume); ■ ends it all
  const MODE = {
    share: { html: ICON.play + 'Start tracking', wide: true, title: 'Share the MapleStory window: through Windows (this app) or your browser (the website)', cmd: 'share' },
    start: { html: ICON.play + 'Start session', wide: true, title: 'Start a session', cmd: 'start' },
    pause: { html: ICON.pause, title: 'Pause', cmd: 'pause' },
    resume: { html: ICON.play, title: 'Resume (shares the game window again first if sharing stopped)', cmd: 'start' },
  };
  let mode = '';
  const setMode = m => {
    if (m === mode) return;
    mode = m; const d = MODE[m], b = $('pp');
    b.innerHTML = d.html; b.title = d.title; b.classList.toggle('wide', !!d.wide); b.classList.toggle('go', !!d.wide);
  };
  setMode('share');
  $('pp').onclick = () => window.overlay.cmd(MODE[mode].cmd);
  $('stop').onclick = () => window.overlay.stop();
  document.addEventListener('contextmenu', e => { e.preventDefault(); window.overlay.menu(); });
  window.overlay.onStats(s => {
    $('ov').classList.toggle('waiting', !s);
    if (!s) { setMode('share'); $('pp').disabled = false; $('stop').disabled = true; return; }
    $('dot').className = 'ov-dot ' + s.state;
    $('dot').title = s.state === 'on' ? 'Tracking' : s.state === 'paused' ? 'Paused' : 'Not tracking';
    text($('time'), s.time); text($('name'), s.name); text($('lv'), s.level ?? '?'); text($('exp'), s.exp);
    $('fill').style.width = Math.max(0, Math.min(100, s.pct || 0)) + '%';
    setMode(s.state === 'on' ? 'pause' : s.state === 'paused' ? 'resume' : s.sharing ? 'start' : 'share');
    $('pp').disabled = mode === 'start' && !s.actionOk;
    $('stop').disabled = !s.canStop;
    const box = $('stats'); box.replaceChildren();
    for (const t of s.tiles || []) {
      const d = document.createElement('div'), k = document.createElement('span'), v = document.createElement('b');
      k.textContent = t.label; v.textContent = t.value; if (t.cls) v.className = t.cls;
      d.append(k, v); box.append(d);
    }
  });
</script>
</body>
</html>
